[package]
name = "wrkt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
inquire = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
